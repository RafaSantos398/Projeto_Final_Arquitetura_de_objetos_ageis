# Produção: PostgreSQL, credenciais via variáveis de ambiente
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.h2.console.enabled=false

# Crie o esquema inicial com scripts/inicializar-postgres.ps1 antes de iniciar.
# O Hibernate confere o esquema existente; não recria tabelas nem apaga os dados.
spring.jpa.hibernate.ddl-auto=validate
