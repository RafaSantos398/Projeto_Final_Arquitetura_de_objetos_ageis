spring.application.name=projeto
server.port=${PORT:8080}

# Perfil usado quando nenhum for informado (ex.: --spring.profiles.active=prod)
spring.profiles.default=dev

spring.jpa.open-in-view=false

# Aula 14: chave em variável de ambiente e validade de uma hora.
jwt.secret=${JWT_SECRET}
jwt.expiration=3600000
app.frontend-origins=${FRONTEND_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:4173,http://127.0.0.1:4173}
