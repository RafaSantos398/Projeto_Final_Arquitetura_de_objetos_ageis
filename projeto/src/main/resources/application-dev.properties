# Desenvolvimento: H2 em memória
spring.datasource.url=jdbc:h2:mem:projeto
spring.datasource.username=sa
spring.datasource.password=

# Console em http://localhost:8080/h2-console (JDBC URL: jdbc:h2:mem:projeto)
spring.h2.console.enabled=true

spring.jpa.hibernate.ddl-auto=create-drop
jwt.secret=${JWT_SECRET:chave-apenas-local-de-desenvolvimento-com-mais-de-32-caracteres}
